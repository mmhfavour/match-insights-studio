name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: cd backend && python -m pytest -q
      - run: python scripts/build_demo.py
      - uses: actions/upload-artifact@v4
        with:
          name: replay
          path: dist/replay.html

  deploy:
    # Runs when the repository has Azure credentials configured (OIDC federated identity).
    needs: test
    if: github.ref == 'refs/heads/main' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build and deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          containerAppName: ${{ vars.CONTAINER_APP_NAME || 'match-insights-studio' }}
          resourceGroup: ${{ vars.RESOURCE_GROUP || 'match-insights-rg' }}
          targetPort: 8000
